name: Probe DCE with headed Chrome

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: Known DCE trading day (YYYYMMDD)
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0
      - name: Ensure Xvfb is available
        run: |
          if ! command -v Xvfb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          command -v google-chrome || command -v google-chrome-stable
      - name: Probe DCE futures and options
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: xvfb-run -a -s '-screen 0 1200x860x24' python scripts/probe_dce_xvfb.py "$TRADE_DATE"
